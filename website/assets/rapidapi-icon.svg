<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="50%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Card / Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#0d9488" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Envelope Body Gradient -->
    <linearGradient id="envGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Flap & Accents Gradient -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="50%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>

    <!-- Verified Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <filter id="badgeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#059669" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Outer squircle container -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)"/>
  
  <!-- Subtle border highlight -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="url(#borderGrad)" stroke-width="3.5" opacity="0.85"/>

  <!-- Subtle background ambient grid / tech circle -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#14b8a6" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.18"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.12"/>

  <!-- Main Envelope Card (with drop shadow) -->
  <g filter="url(#shadowFilter)">
    <!-- Base envelope backplate -->
    <rect x="100" y="148" width="312" height="216" rx="28" fill="url(#envGrad)" stroke="#334155" stroke-width="2.5"/>

    <!-- Inside mail glow accent -->
    <path d="M124 168 L256 264 L388 168" fill="none" stroke="#14b8a6" stroke-width="2" opacity="0.25"/>

    <!-- Bottom fold seams -->
    <path d="M104 356 L208 252 M408 356 L304 252" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>

    <!-- Top Flap triangle folded with stylish gradient -->
    <path d="M102 168 C 102 154, 112 148, 126 148 L 386 148 C 400 148, 410 154, 410 168 L 268 266 C 261 271, 251 271, 244 266 Z" 
          fill="url(#envGrad)" stroke="#334155" stroke-width="2.5"/>
    
    <!-- Neon Teal V-Accent on the flap -->
    <path d="M120 164 L 256 258 L 392 164" 
          fill="none" stroke="url(#tealGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"
          filter="url(#subtleGlow)"/>

    <!-- Data / API connection pulses (nodes) -->
    <circle cx="160" cy="308" r="5" fill="#38bdf8" opacity="0.8"/>
    <circle cx="190" cy="308" r="5" fill="#2dd4bf" opacity="0.8"/>
    <circle cx="220" cy="308" r="5" fill="#14b8a6" opacity="0.5"/>
    <line x1="160" y1="308" x2="220" y2="308" stroke="#334155" stroke-width="2"/>
  </g>

  <!-- Large floating verified checkmark badge -->
  <g filter="url(#badgeShadow)">
    <!-- Badge background disc -->
    <circle cx="360" cy="344" r="58" fill="#0b1220" stroke="#10b981" stroke-width="3"/>
    <circle cx="360" cy="344" r="48" fill="url(#badgeGrad)"/>

    <!-- Crisp Checkmark -->
    <path d="M340 344 L354 358 L382 330" 
          fill="none" stroke="#ffffff" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Pulse dots near the badge (representing verification ping / latency speed) -->
  <circle cx="432" cy="308" r="4" fill="#34d399" opacity="0.75"/>
  <circle cx="444" cy="336" r="3" fill="#2dd4bf" opacity="0.5"/>
</svg>