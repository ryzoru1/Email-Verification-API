<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Glowing Shield Gradient -->
    <linearGradient id="shieldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>

    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#134e4a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#042f2e" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Flap Gradient -->
    <linearGradient id="mailGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="mainShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#shieldBg)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="#1e293b" stroke-width="2.5"/>

  <!-- Subtle Circular Radar/API Grid Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#14b8a6" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.15"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.12"/>

  <!-- Main Security Shield Envelope Shape -->
  <g filter="url(#mainShadow)">
    <!-- Security Shield Silhouette -->
    <path d="M 256 90
             L 370 134
             C 370 230, 340 334, 256 394
             C 172 334, 142 230, 142 134
             Z"
          fill="url(#shieldFill)"
          stroke="url(#shieldStroke)"
          stroke-width="5"
          stroke-linejoin="round"/>

    <!-- Subtle inner shield contour -->
    <path d="M 256 114
             L 348 150
             C 348 230, 322 316, 256 368
             C 190 316, 164 230, 164 150
             Z"
          fill="none"
          stroke="#14b8a6"
          stroke-width="1.5"
          opacity="0.3"/>

    <!-- Stylized Mail Envelope folded lines inside shield -->
    <path d="M 180 180
             L 256 242
             L 332 180"
          fill="none"
          stroke="url(#mailGlow)"
          stroke-width="7"
          stroke-linecap="round"
          stroke-linejoin="round"
          filter="url(#neonGlow)"/>

    <path d="M 180 180 L 180 270 C 180 295, 215 330, 256 345 C 297 330, 332 295, 332 270 L 332 180"
          fill="none"
          stroke="#38bdf8"
          stroke-width="3"
          opacity="0.4"/>

    <!-- Bold Verified Checkmark Floating in the Center/Lower shield -->
    <circle cx="256" cy="285" r="42" fill="#0b1220" stroke="#10b981" stroke-width="3.5"/>
    <circle cx="256" cy="285" r="35" fill="#10b981"/>
    <path d="M 240 285 L 251 296 L 273 273"
          fill="none"
          stroke="#ffffff"
          stroke-width="6"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>

  <!-- Glowing signal dots / API endpoints -->
  <circle cx="256" cy="426" r="4" fill="#2dd4bf" opacity="0.9"/>
  <circle cx="236" cy="426" r="2.5" fill="#38bdf8" opacity="0.5"/>
  <circle cx="276" cy="426" r="2.5" fill="#38bdf8" opacity="0.5"/>
</svg>